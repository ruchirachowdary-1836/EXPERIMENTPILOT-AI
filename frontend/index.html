<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="ExperimentPilot AI diagnoses why machine-learning models fail by choosing the most informative, cheapest and safest diagnostic experiment at every step." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ExperimentPilot AI</title>
    <script>
      try {
        var t = localStorage.getItem("ep-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
          document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
